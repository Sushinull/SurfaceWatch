x-demo-smtp: &demo-smtp
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: surfacewatch@localhost
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_STARTTLS: "false"
  SMTP_ALLOW_PLAINTEXT: "true"
services:
  lab:
    build: ./demo
    environment:
      EXTRA_SERVICE: ${EXTRA_SERVICE:-false}
      CERT_DAYS: ${CERT_DAYS:-90}
    networks:
      lab: {ipv4_address: 172.30.0.10}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: [127.0.0.1:8025:8025]
    # A normal bridge supplies published-port reachability on Docker Engine 29.
    # SMTP still travels over lab; only the inspection UI is published to loopback.
    networks: [lab, default]
  backend:
    environment: *demo-smtp
  worker:
    environment: *demo-smtp
