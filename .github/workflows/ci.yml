name: SurfaceWatch checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: surfacewatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: surfacewatch
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U surfacewatch"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SECRET_KEY: ci-only-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql+psycopg://surfacewatch:ci-only-password@localhost:5432/surfacewatch
      TEST_DATABASE_URL: postgresql+psycopg://surfacewatch:ci-only-password@localhost:5432/surfacewatch
      RUN_LIVE_LAB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend/app backend/tests backend/migrations demo scripts
      - run: python -m ruff format --check backend/app backend/tests backend/migrations demo scripts
      - run: python -m alembic upgrade head && python -m alembic check
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: pip install pip-audit==2.10.0 && python -m pip_audit -r backend/requirements.txt --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check 'src/**/*.{ts,tsx,css}' 'tests/**/*.mjs' '*.json' '*.ts' index.html
      - run: npm audit
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: surfacewatch-regression
      SW_ACCEPTANCE_CREDENTIALS: /tmp/surfacewatch-acceptance.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python scripts/setup.py
      - run: docker version --format '{{.Server.Version}}' && docker compose version
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build -d --wait
      - run: curl --fail http://localhost:8080/api/health
      - run: python scripts/demo_acceptance.py --disposable --credentials-file "$SW_ACCEPTANCE_CREDENTIALS"
      - run: npm ci && npx playwright install --with-deps chromium && node tests/demo-smoke.mjs
        working-directory: frontend
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --no-color
        if: failure()
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
        if: always()
